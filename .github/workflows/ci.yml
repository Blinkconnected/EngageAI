name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend / lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .
      - name: mypy --strict
        working-directory: backend
        run: mypy src

  backend-test:
    name: Backend / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: pytest
        working-directory: backend
        # Every test runs against in-memory SQLite/fakeredis (see
        # tests/conftest.py) — no Postgres/Redis/RabbitMQ service
        # containers needed here. Real-broker/real-Postgres behavior
        # (migrations, SKIP LOCKED, aio-pika) is verified manually against
        # docker-compose per docs/architecture/*.md's own verification
        # sections, not in this job.
        run: pytest -q --cov=blinkengage --cov-report=term-missing
      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          # Advisory only (see docs/security/hardening.md for the triage
          # process and the currently-accepted-risk list) — a new CVE
          # landing upstream shouldn't fail every PR with no human
          # judgment applied, but it must be visible in every run's log.
          pip-audit || echo "::warning::pip-audit found findings — see docs/security/hardening.md for triage"

  frontend-lint:
    name: Frontend / lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: prettier --check
        working-directory: frontend
        run: npm run format:check
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

  frontend-test:
    name: Frontend / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: vitest
        working-directory: frontend
        run: npm test

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend (runtime target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          target: runtime
          push: false
          tags: blinkengage-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build nginx (frontend + reverse proxy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: false
          tags: blinkengage-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Vulnerability scan (image)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: blinkengage-backend:scan
          cache-from: type=gha
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: blinkengage-backend:scan
          severity: CRITICAL,HIGH
          exit-code: "0" # advisory — see docs/security/hardening.md's triage process
          format: table

  # A real deploy target (which cloud provider, which host, which registry)
  # is an infrastructure/business decision this codebase can't make on its
  # own — see docs/architecture/observability.md. This job is intentionally
  # a documented placeholder: it only runs on an explicit version tag, and
  # every step it *would* take is named and commented rather than faked
  # against a nonexistent target. Wire in real secrets
  # (`DEPLOY_HOST`/`DEPLOY_SSH_KEY`/registry credentials, etc.) and replace
  # the placeholder step to activate it.
  deploy:
    name: Deploy (placeholder — see comments)
    runs-on: ubuntu-latest
    needs: [scan]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "No deploy target is configured yet."
          echo "A real deploy job here would typically:"
          echo "  1. Build and push docker/backend + docker/nginx images to a registry."
          echo "  2. SSH (or use a cloud provider's deploy action) to the target host."
          echo "  3. Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml pull"
          echo "  4. Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d"
          echo "  5. Run scripts/backup_postgres.sh beforehand as a pre-deploy safety net."
          echo "See docs/deployment/production.md."
