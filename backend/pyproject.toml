[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blinkengage"
version = "0.1.0"
description = "Blink Engage — Enterprise AI Powered Omnichannel Customer Engagement Platform (backend)"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }

dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy[asyncio]==2.0.36",
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "redis==5.2.1",
  "celery[redis]==5.4.0",
  "pika==1.3.2",
  "aio-pika==9.5.3",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.2.1",
  "python-multipart==0.0.20",
  "structlog==24.4.0",
  "httpx==0.28.1",
  "tenacity==9.0.0",
  "dependency-injector==4.44.0",
  "minio==7.2.13",
  "email-validator==2.2.0",
  "orjson==3.10.12",
  "prometheus-fastapi-instrumentator==7.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "pytest-env==1.1.5",
  "ruff==0.8.4",
  "black==24.10.0",
  "mypy==1.14.0",
  "aiosqlite==0.20.0",
  "factory-boy==3.3.1",
  "faker==33.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
env = [
  "ENVIRONMENT=test",
  "JWT_SECRET_KEY=test-secret-key-not-for-production-use-0123456789",
  "DATABASE_URL=sqlite+aiosqlite:///:memory:",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
