# Production overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Swaps the backend/celery images to their lean "runtime" target (no bind
# mounts, no dev dependencies), and replaces the dev NGINX + Vite-dev-server
# pair with a single production NGINX image that serves the compiled SPA and
# reverse-proxies to the backend.
#
# NOTE: Compose merges list/map fields (volumes, depends_on, ...) by
# concatenation/union by default, not replacement — `!override` is used
# below wherever a base list/map must be fully replaced rather than
# appended to.

services:
  backend:
    build:
      target: runtime
    restart: always
    volumes: !override []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  celery-worker:
    build:
      target: runtime
    restart: always
    volumes: !override []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  celery-beat:
    build:
      target: runtime
    restart: always
    volumes: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  audit-log-consumer:
    build:
      target: runtime
    restart: always
    volumes: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  conversation-ingest-consumer:
    build:
      target: runtime
    restart: always
    volumes: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  workflow-engine-consumer:
    build:
      target: runtime
    restart: always
    volumes: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  notification-consumer:
    build:
      target: runtime
    restart: always
    volumes: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  reporting-consumer:
    build:
      target: runtime
    restart: always
    volumes: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # The dev Vite server is not used in production; the compiled SPA is baked
  # into the `nginx` image below. Gate it behind a profile that stays
  # inactive unless explicitly requested, so `docker compose up` never
  # starts it under this overlay.
  frontend:
    profiles: ["dev-only"]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-/ws}
    image: blinkengage-nginx:prod
    volumes: !override []
    depends_on: !override
      backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis:
    restart: always

  rabbitmq:
    restart: always
