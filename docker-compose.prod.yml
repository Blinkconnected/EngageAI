# Production overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Swaps the backend/celery images to their lean "runtime" target (no bind
# mounts, no dev dependencies), and replaces the dev NGINX + Vite-dev-server
# pair with a single production NGINX image that serves the compiled SPA and
# reverse-proxies to the backend.
#
# NOTE: Compose merges list/map fields (volumes, depends_on, ...) by
# concatenation/union by default, not replacement — `!override` is used
# below wherever a base list/map must be fully replaced rather than
# appended to.

# Log rotation, applied to every service below.
#
# Without it the json-file driver grows without limit, and the first
# symptom is the host filling up — which takes the database with it. Three
# 50 MB files per container is enough to investigate an incident from and
# bounded enough that thirty containers cannot exhaust a disk.
x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Liveness for the consumer processes.
#
# The image's baked-in HEALTHCHECK curls :8000, which is right for the API
# and wrong for these — they run a consumer script and nothing listens on
# that port, so it would report permanently unhealthy. This checks the
# process is actually there instead, which catches it dying without the
# container exiting.
#
# It proves the process exists, not that it is consuming. Queue-level
# consumer count is the authoritative signal and is alerted on
# (docker/grafana/provisioning/alerting/rules.yml).
x-consumer-healthcheck: &consumer-healthcheck
  test:
    - CMD-SHELL
    - "grep -l blinkengage.infrastructure.events.consumers /proc/*/cmdline >/dev/null 2>&1"
  interval: 30s
  timeout: 5s
  start_period: 20s
  retries: 3

# Production identity, asserted here rather than inherited from .env.
#
# The base file defaults these to `${ENVIRONMENT:-development}` and
# `${DEBUG:-true}`, so a production host whose .env is missing, partial, or
# copied from a developer's machine comes up in development mode — with
# tracebacks returned to unauthenticated callers on error. Setting them in
# the overlay makes the production posture a property of *the file you
# deploy with*, not of a file that is deliberately not in version control.
#
# Compose merges `environment` maps across files, so the base map still
# supplies every other variable; only these two are overridden.
x-prod-env: &prod-env
  ENVIRONMENT: production
  DEBUG: "false"

services:
  backend:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    # The base file publishes "8000:8000", which binds 0.0.0.0 and puts the
    # API on the public internet beside nginx — bypassing the edge that
    # terminates TLS, sets the security headers and applies rate limiting.
    # nginx reaches the backend over the compose network and needs no
    # published port at all; this one exists for local development.
    #
    # Bound to loopback rather than removed, so an operator on the host can
    # still curl it, and so the readiness probe used during deployment keeps
    # working.
    #
    # A host firewall is not a substitute. Docker inserts its rules into the
    # DOCKER chain, which iptables traverses *before* the INPUT chain ufw
    # manages, so `ufw deny 8000` leaves a published port reachable. The
    # binding is the control; the firewall is defence in depth. Verify with
    # `ss -tulpn`, never with `ufw status`.
    ports: !override
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  # NOTE on healthchecks below: docker/backend/Dockerfile's `runtime` stage
  # bakes in a HEALTHCHECK that curls the web server on :8000 — correct for
  # `backend`, wrong for every other service here, since they all build
  # from that same image/target but run a Celery worker/beat process or a
  # standalone RabbitMQ consumer script, never a web server. Left
  # unoverridden, every one of these permanently reports "unhealthy" (the
  # curl always fails — nothing listens on :8000) even while working
  # correctly, which is a real operational hazard: false-unhealthy status
  # trains operators to ignore health state. Confirmed live during M36's
  # production-stack verification (docs/ROADMAP.md).
  celery-worker:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck:
      test: ["CMD", "celery", "-A", "blinkengage.core.celery_app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  # celery beat has no equivalent to `inspect ping` (it schedules, it
  # doesn't answer worker-control commands) — disable the inherited
  # web-server healthcheck rather than have it permanently lie.
  # docker-compose's own `restart: always` plus the celery-exporter
  # service's Prometheus metrics are what actually cover this process's
  # liveness/observability, not a binary Docker healthcheck.
  celery-beat:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  audit-log-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  conversation-ingest-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  workflow-engine-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  notification-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  reporting-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  csat-dispatch-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  ai-autopilot-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  autopilot-sla-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  erp-sync-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # The dev Vite server is not used in production; the compiled SPA is baked
  # into the `nginx` image below. Gate it behind a profile that stays
  # inactive unless explicitly requested, so `docker compose up` never
  # starts it under this overlay.
  # Missing from this overlay until the operational hardening pass, which
  # meant they ran in production with no resource limit at all — a leak in
  # one would take the host down rather than being OOM-killed and
  # restarted. usage-metering-consumer is the one that mattered most: it
  # is on the billing path.
  usage-metering-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  learning-observation-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  learning-signals-consumer:
    build:
      target: runtime
    image: blinkengage-backend:prod
    environment: *prod-env
    restart: always
    logging: *prod-logging
    volumes: !override []
    healthcheck: *consumer-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  frontend:
    logging: *prod-logging
    profiles: ["dev-only"]

  nginx:
    logging: *prod-logging
    # The edge: if it is not serving, nothing is. Checked against its own
    # stub_status rather than a proxied route, so a backend outage does not
    # also mark the proxy unhealthy and restart it — which would turn one
    # failure into two.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-/api/v1/ws}
    image: blinkengage-nginx:prod
    # The config and the built bundle come from the image, so the dev
    # bind-mounts are dropped — but the TLS material cannot be baked in and
    # must still come from the host. `!override` replaces the base list
    # wholesale, so anything omitted here is simply absent: an empty list
    # here is what left the production image with no certificate to serve.
    volumes: !override
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker/nginx/acme:/var/www/acme:ro
    depends_on: !override
      backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m

  postgres:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  rabbitmq:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  # --- Storage and monitoring -----------------------------------------
  #
  # These were left out of this overlay entirely, so they ran in
  # production on the base file's `restart: unless-stopped` and with no
  # memory limit and no log rotation at all. That is the same unbounded
  # failure the consumers were fixed for, on the services that are
  # supposed to tell you the host is in trouble — Loki and Prometheus
  # both grow with retention, and a monitoring stack that fills the disk
  # takes the database down with it and then cannot report why.
  #
  # Limits are sized for the pilot's single host. Prometheus and Loki get
  # the most because they hold series and index in memory; the exporters
  # are scrape-and-forget and need almost nothing.

  minio:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  prometheus:
    logging: *prod-logging
    restart: always
    # Prometheus ships no authentication and none can be configured — its
    # /api/v1/query endpoint answers whoever asks. Published on 0.0.0.0 by
    # the base file, it hands the internet every metric this platform emits:
    # company names carried in labels, request volumes, queue depths, error
    # rates. Reach it over an SSH tunnel instead:
    #   ssh -L 9090:127.0.0.1:9090 root@<host>
    ports: !override
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  grafana:
    logging: *prod-logging
    restart: always
    # Grafana does authenticate, so this is a smaller exposure than
    # Prometheus above — but it is a login form on the public internet
    # guarding GF_SECURITY_ADMIN_PASSWORD, and it is reached by operators
    # rather than customers. Same SSH tunnel:
    #   ssh -L 3000:127.0.0.1:3000 root@<host>
    ports: !override
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      # Provisioning runs at start-up and fails the boot if a contact
      # point or datasource is malformed, so this needs long enough to
      # tell "still provisioning" from "refusing to start".
      start_period: 60s
      retries: 3

  loki:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  promtail:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # The destination alerts fall back to when no external webhook is set.
  # It must outlive the incident it is reporting, hence `always`.
  alert-sink:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m

  postgres-exporter:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  redis-exporter:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  celery-exporter:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9808/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Runs once, creates the bucket, exits. `restart: always` would put it
  # in a loop and a healthcheck has nothing to probe — but its logs are
  # where a failed bucket creation shows up, so it still gets rotation.
  minio-init:
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  # A test SMTP server has no business in production — leaving it running
  # would mean production mail silently landing in a fake inbox.
  #
  # `profiles` rather than `replicas: 0`, matching how `frontend` is
  # excluded above. Both stop the container starting, but a profile removes
  # the service from the production project *entirely*, and that difference
  # is visible where it matters: with `replicas: 0` the service still
  # appears in `docker compose config` carrying its base-file
  # `ports: 3025/3143` on 0.0.0.0, so an audit of what production publishes
  # has to reason about whether a scaled-to-zero service can bind a port.
  # Under a profile there is nothing to reason about — the ports are not in
  # the resolved configuration at all.
  #
  # Nothing depends_on greenmail, so excluding it starts no dependency
  # resolution failure. SMTP_HOST still defaults to `greenmail` in the base
  # environment map; production supplies a real relay through .env, and the
  # active per-company email channels carry their own credentials in the
  # database regardless.
  greenmail:
    profiles: ["dev-only"]

  nginx-exporter:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64m

  node-exporter:
    logging: *prod-logging
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
