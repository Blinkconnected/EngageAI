name: blinkengage

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY must be set in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blinkengage}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-blinkengage}
  REDIS_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-blinkengage}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set in .env}@rabbitmq:5672/
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-blinkengage}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
  S3_BUCKET_ATTACHMENTS: ${S3_BUCKET_ATTACHMENTS:-blinkengage-attachments}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
  SMTP_HOST: ${SMTP_HOST:-greenmail}
  SMTP_PORT: ${SMTP_PORT:-3025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-notifications@blinkengage.local}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Blink Engage}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blinkengage}
      POSTGRES_USER: ${POSTGRES_USER:-blinkengage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blinkengage} -d ${POSTGRES_DB:-blinkengage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [blinkengage]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [blinkengage]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-blinkengage}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set in .env}
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [blinkengage]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-blinkengage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [blinkengage]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-blinkengage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      S3_BUCKET_ATTACHMENTS: ${S3_BUCKET_ATTACHMENTS:-blinkengage-attachments}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET_ATTACHMENTS
      "
    networks: [blinkengage]

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8000:8000"
    healthcheck:
      # /health/ready (M27), not the plain liveness /health — reflects
      # whether Postgres/Redis/RabbitMQ are actually reachable, which is
      # what nginx's service_healthy gate and a load-balanced pool's
      # traffic routing should key off, not just "the process is up."
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [blinkengage]

  celery-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["celery", "-A", "blinkengage.core.celery_app.celery_app", "worker", "--loglevel=info"]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [blinkengage]

  celery-beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["celery", "-A", "blinkengage.core.celery_app.celery_app", "beat", "--loglevel=info"]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [blinkengage]

  # Domain event bus consumer — see docs/architecture/event-bus.md. Not a
  # Celery worker: it holds its own long-lived RabbitMQ topic-exchange
  # binding (queue "audit-log", routing key "#") rather than picking up
  # dispatched Celery tasks, so it's a separate service/process. Future
  # consumers (AI, workflow engine, notifications, ERP sync, reporting)
  # each get their own such service alongside this one, with zero changes
  # to it, the relay, or each other.
  audit-log-consumer:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["python", "-m", "blinkengage.infrastructure.events.consumers.audit_log_consumer"]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [blinkengage]

  # The "conversation engine" (M13, see docs/architecture/conversations.md)
  # — another independent consumer bound to its own queue on the M10 event
  # bus, same shape as audit-log-consumer, zero coupling between the two.
  conversation-ingest-consumer:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "blinkengage.infrastructure.events.consumers.conversation_ingest_consumer",
      ]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [blinkengage]

  # The Workflow Engine (M19, see docs/architecture/workflow-engine.md) —
  # binds "#" (every event, since a workflow can trigger on any event
  # type), same shape as audit-log-consumer, zero coupling to it or the
  # conversation engine.
  workflow-engine-consumer:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "blinkengage.infrastructure.events.consumers.workflow_engine_consumer",
      ]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [blinkengage]

  # Built-in lifecycle notifications (M21, see
  # docs/architecture/notifications.md) — binds a fixed, code-defined set
  # of routing keys (assignment/SLA events), unlike the Workflow Engine's
  # "#", since these are first-party notifications every company gets.
  notification-consumer:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "blinkengage.infrastructure.events.consumers.notification_consumer",
      ]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [blinkengage]

  # Reports & Analytics (M23, see docs/architecture/reports-analytics.md)
  # — maintains the *_daily_stats rollup tables incrementally, binding a
  # fixed, code-defined set of routing keys (like notification-consumer),
  # same shape as every other M10 event-bus consumer. No Redis dependency
  # (unlike notification-consumer) since it never publishes realtime
  # signals, only writes rollup rows.
  reporting-consumer:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "blinkengage.infrastructure.events.consumers.reporting_consumer",
      ]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [blinkengage]

  # ERPNext Integration (M24, see docs/architecture/erp-integration.md) —
  # binds customer.created only, pushing a new customer to ERPNext for
  # any company with an active ErpConfig (a no-op for the rest). Inbound
  # sync is webhook-driven (POST /webhooks/erpnext/...), not a consumer.
  erp-sync-consumer:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "blinkengage.infrastructure.events.consumers.erp_sync_consumer",
      ]
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [blinkengage]

  # Local SMTP+IMAP test mailbox for manually verifying the Email channel
  # (M15, see docs/architecture/email-channel.md) end-to-end — outbound
  # send and the IMAP poll task — without depending on a real mail
  # provider. Not part of any other service's dependency graph; point a
  # test ChannelConfig's credentials at smtp_host/imap_host: "greenmail",
  # port 3025 (SMTP) / 3143 (IMAP), user/pass "support"/"support".
  greenmail:
    image: greenmail/standalone:latest
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=support:support@blinkengage.test
    ports:
      - "3025:3025"
      - "3143:3143"
    networks: [blinkengage]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-/ws}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks: [blinkengage]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    networks: [blinkengage]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-blinkengage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blinkengage}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    networks: [blinkengage]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    networks: [blinkengage]

  # Celery queue/task metrics (M27, see docs/architecture/observability.md)
  # — listens to the Celery events stream over the same broker every
  # celery-worker/celery-beat already uses; no changes to those services
  # needed for their tasks/queues to become visible in Prometheus.
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    restart: unless-stopped
    # --broker-url as an explicit CLI arg, not an env var — confirmed
    # against the image directly that it has no documented env-var
    # binding, only a required --broker-url flag.
    command:
      [
        "--broker-url",
        "${RABBITMQ_URL:-amqp://blinkengage:blinkengage@rabbitmq:5672/}",
      ]
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [blinkengage]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [blinkengage]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks: [blinkengage]

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [blinkengage]

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks: [blinkengage]

networks:
  blinkengage:
    name: blinkengage

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  frontend_node_modules:
