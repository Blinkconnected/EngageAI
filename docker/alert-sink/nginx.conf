# The alert of last resort.
#
# Grafana's contact points point here by default. In a real deployment
# ALERT_CRITICAL_WEBHOOK_URL points at Slack or PagerDuty instead — but
# the default has to go *somewhere durable*, because the failure this
# guards against is the quiet one: a webhook URL that was never set, or
# was rotated and not updated, so every alert POSTs into a black hole and
# the monitoring stack looks healthy right up until an incident is missed.
#
# Here, an alert always lands in the container's stdout. That is
# deliberate rather than a file: nginx cannot rotate its own logs, and an
# alert log growing without a bound on the host whose disk-filling alert
# it carries would be its own punchline. stdout is captured by the
# json-file driver (rotated in docker-compose.prod.yml) and shipped to
# Loki by Promtail, so alerts are queryable alongside everything else and
# scripts/verify_alerting.sh reads them back to prove delivery.
#
# Stock nginx, no modules, because a monitoring component that needs its
# own build is a monitoring component that rots.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-alert-sink.pid;

events {
    worker_connections 64;
}

http {
    access_log off;

    # Everything the operator needs to triage from the log line alone:
    # which severity channel fired, and the alert payload itself.
    log_format alertlog escape=none
        '{"ts":"$time_iso8601","channel":"$alert_channel","body":$request_body}';

    client_body_buffer_size 256k;
    client_max_body_size 4m;

    # Stock nginx only populates $request_body once something has read
    # the body — `return 204` alone would log an empty payload, which is
    # the one thing this exists to capture. Proxying to a local sink
    # forces the read, and the sink is this same server on 127.0.0.1.
    upstream body_reader {
        server 127.0.0.1:8081;
    }

    server {
        listen 8080;

        location /critical {
            set $alert_channel "critical";
            access_log /dev/stdout alertlog;
            proxy_pass http://body_reader/ack;
            proxy_set_header Host $host;
        }

        location /warning {
            set $alert_channel "warning";
            access_log /dev/stdout alertlog;
            proxy_pass http://body_reader/ack;
            proxy_set_header Host $host;
        }

        # For scripts/verify_alerting.sh and the container healthcheck.
        location = /healthz {
            return 200 "ok\n";
        }
    }

    # The body reader. Discards and acknowledges — the logging already
    # happened in the server block above, which is the point of the hop.
    server {
        listen 127.0.0.1:8081;
        location /ack {
            return 204;
        }
    }
}
