apiVersion: 1

# Where an alert actually goes.
#
# Two destinations, split by severity, because they are read differently:
# a critical page interrupts somebody at 03:00 and must be rare enough
# that it is always answered; a warning goes to a channel that is read
# during the working day. One destination for both trains people to mute
# the one that wakes them.
#
# URLs come from the environment. They are secrets — a Slack webhook URL
# is a bearer credential — so they belong in the deployment's secret store
# rather than in this file. Grafana substitutes ${VAR} from its own
# environment at provisioning time.
#
# The default lives in docker-compose.yml, NOT here. Grafana substitutes
# plain ${VAR} only — it has no shell-style ${VAR:-default} form, and an
# unset variable expands to an empty string, which fails the webhook
# integration's required-'url' validation. That failure is not confined
# to the contact point: provisioning is a start-up module, so Grafana
# exits and the entire monitoring stack goes down. Verified by doing it.
#
# So the fallback is applied by Compose, where ${VAR:-default} does work,
# and Grafana is guaranteed a non-empty URL. Point these at Slack or
# PagerDuty by setting the variables in .env; leave them unset and alerts
# still land durably in the on-host sink rather than nowhere.
# Renaming a contact point does not remove the old one. Grafana's
# provisioning is upsert-by-uid, so `ops-placeholder` survived in the
# database after this file stopped mentioning it — still selectable,
# still pointing at an unroutable .invalid host, and still able to be
# picked as a destination by anybody editing a rule in the UI. A
# placeholder that is merely unreferenced has not been replaced.
deleteContactPoints:
  - orgId: 1
    uid: ops-placeholder-webhook

contactPoints:
  - orgId: 1
    name: ops-critical
    receivers:
      - uid: ops-critical-webhook
        type: webhook
        settings:
          url: ${ALERT_CRITICAL_WEBHOOK_URL}
          httpMethod: POST
          maxAlerts: 0
        disableResolveMessage: false

  - orgId: 1
    name: ops-warning
    receivers:
      - uid: ops-warning-webhook
        type: webhook
        settings:
          url: ${ALERT_WARNING_WEBHOOK_URL}
          httpMethod: POST
          maxAlerts: 0
        disableResolveMessage: false

  # The heartbeat's own destination.
  #
  # Deliberately separate. `Alerting heartbeat` fires continuously by
  # design, so routing it to ops-warning would bury every real warning
  # under it and teach people to mute the channel — the exact outcome the
  # split above exists to prevent.
  #
  # Point this at a dead-man's-switch service (one that alerts when it
  # STOPS hearing from you). Left unset it lands in the on-host sink,
  # where its absence is still observable by reading the log.
  - orgId: 1
    name: ops-heartbeat
    receivers:
      - uid: blinkengage-ops-heartbeat
        type: webhook
        settings:
          url: ${ALERT_HEARTBEAT_WEBHOOK_URL}
