apiVersion: 1

groups:
  - orgId: 1
    name: blinkengage-alerts
    folder: Blink Engage
    interval: 1m
    rules:
      - uid: blinkengage-high-5xx-rate
        title: High 5xx error rate
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Backend 5xx error rate is above 5% of total requests.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                sum(rate(http_requests_total{job="blinkengage-backend", status=~"5.."}[5m]))
                /
                sum(rate(http_requests_total{job="blinkengage-backend"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C

      - uid: blinkengage-high-p95-latency
        title: High p95 request latency
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: p95 request latency is above 2 seconds.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                histogram_quantile(0.95,
                  sum(rate(http_request_duration_seconds_bucket{job="blinkengage-backend"}[5m])) by (le)
                )
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
              refId: C

      - uid: blinkengage-postgres-down
        title: PostgreSQL is down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: postgres-exporter cannot reach PostgreSQL.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: pg_up
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-redis-down
        title: Redis is down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: redis-exporter cannot reach Redis.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: redis_up
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-queue-backlog
        title: RabbitMQ queue backlog
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A queue has over 1000 ready messages for 10+ minutes — consumers may be stuck or under-provisioned.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(rabbitmq_queue_messages_ready{job="rabbitmq-queues"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1000] }
              refId: C

      - uid: blinkengage-celery-task-failures
        title: Celery task failure rate
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Celery tasks are failing at more than 1/minute, sustained for 5+ minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(rate(celery_task_failed_total[5m])) * 60
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: C

      # The gap the backlog alert cannot see. A queue with zero consumers and
      # zero messages looks identical to a healthy idle queue on a depth graph;
      # the difference only shows in the consumer count. This is what catches a
      # consumer container that died and was not restarted.
      - uid: blinkengage-queue-no-consumers
        title: Event queue has no consumers
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A durable event queue has zero consumers attached — messages are accumulating unread.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                min by (queue) (rabbitmq_queue_consumers{job="rabbitmq-queues", queue!~"celery.*|.+\\.retry|.+\\.dlq"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # A dead-lettered message is one the platform gave up on. It is safe —
      # quarantined rather than lost, and replayable — but it is also an event
      # that did not happen, so somebody has to decide whether it mattered.
      # Fires at one message, not at a rate: a single poison event is a defect.
      - uid: blinkengage-dlq-not-empty
        title: Messages in a dead-letter queue
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: One or more events were dead-lettered after exhausting their retries — they are quarantined and need triage.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                sum(rabbitmq_queue_messages{job="rabbitmq-queues", queue=~".+\\.dlq"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      # The transactional outbox is the only path events take out of the
      # database. If the relay stops, every downstream consumer goes quiet and
      # nothing else alerts — the queues are empty, which reads as healthy.
      - uid: blinkengage-outbox-stalled
        title: Outbox relay is not draining
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Undispatched outbox events are accumulating — the relay has stopped or is failing to publish.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                blinkengage_outbox_undispatched
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [500] }
              refId: C

      # Found for real in phase 1.5: beat had been up 41 hours and had no entry
      # for a newly-added schedule, so the sweep never fired. Nothing errored,
      # no queue grew, and the dashboard showed numbers that looked like 'no
      # traffic' rather than 'the scheduler forgot'. Two hours covers the
      # hourly sweeps with margin.
      - uid: blinkengage-scheduler-stale
        title: A scheduled sweep has stopped running
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A Celery beat schedule has not produced a run within its expected interval.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              # Each task measured against its OWN interval, not a shared
              # threshold. The beat schedule spans five seconds (the outbox
              # relay) to twenty-four hours (configuration drift), so any
              # single number is either permanently breached by the daily
              # tasks — paging every morning about something healthy — or
              # blind to a five-second task that died yesterday.
              #
              # The result is "intervals missed"; the threshold below is 3,
              # so a task has to miss three of its own cycles.
              expr: >-
                max(
                  (time() - blinkengage_scheduler_last_run_timestamp_seconds)
                  / on(task) group_left blinkengage_scheduler_expected_interval_seconds
                )
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3] }
              refId: C

      # Backed by the node-exporter scrape job. A full disk is the failure
      # that takes the database down with it, and it is entirely
      # predictable — which makes not alerting on it the least excusable
      # of the gaps this work closed.
      - uid: blinkengage-disk-filling
        title: Host disk is filling
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Less than 15% of disk remains — Postgres stops accepting writes when it runs out.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                100 * min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [15] }
              refId: C

      # Attachments live here. A customer sending a photo gets a failure and the
      # API surfaces it as a 500, so this is customer-visible immediately.
      - uid: blinkengage-minio-down
        title: MinIO is unreachable
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Object storage is down — attachments cannot be read or written.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                min(up{job="minio"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-nginx-down
        title: nginx is down
        condition: C
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: The edge is not answering. Every customer request goes through nginx, so this is a total outage from a customer's point of view.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              # `nginx_up`, not `up{job="nginx"}`. The exporter is a
              # separate process: when nginx dies it keeps answering
              # Prometheus and reports nginx_up=0, so the scrape stays
              # healthy and `up` stays 1. A rule on `up` would have been
              # silent for exactly the outage it is named after —
              # verified by stopping nginx and watching it not fire.
              #
              # `or vector(0)` covers the other direction: if the
              # exporter itself is gone the series disappears entirely,
              # and an alert with no data is an alert that does not fire.
              expr: nginx_up or vector(0)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-grafana-down
        title: Grafana is down
        condition: C
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: Grafana is unreachable. Alert evaluation and every dashboard stop with it.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="grafana"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-loki-down
        title: Loki is down
        condition: C
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: Loki is unreachable. Logs are still written to disk but cannot be searched during an incident.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="loki"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # A heartbeat that is always firing, on purpose.
      #
      # Every other rule here proves something is wrong. None of them can
      # prove the alerting path itself still works: if Grafana stops
      # evaluating, or the contact point silently stops delivering, the
      # symptom is *silence* — which is indistinguishable from a healthy
      # platform. `vector(1) > 0` is unconditionally true, so this fires
      # continuously and the sink receives it on every notification cycle.
      #
      # The signal is its ABSENCE. If ops-heartbeat stops arriving, alerting
      # is broken, whatever the dashboards say. Route it somewhere that
      # notices silence rather than at a human, who would learn to ignore it.
      - uid: blinkengage-alerting-heartbeat
        title: Alerting heartbeat
        condition: C
        for: 0s
        labels:
          severity: heartbeat
        annotations:
          summary: >-
            Always firing. Its absence means the alerting path is broken, not
            that the platform is healthy.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: vector(1)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
