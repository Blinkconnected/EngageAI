apiVersion: 1

groups:
  - orgId: 1
    name: blinkengage-alerts
    folder: Blink Engage
    interval: 1m
    rules:
      - uid: blinkengage-high-5xx-rate
        title: High 5xx error rate
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Backend 5xx error rate is above 5% of total requests.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              expr: >-
                sum(rate(http_requests_total{job="blinkengage-backend", status=~"5.."}[5m]))
                /
                sum(rate(http_requests_total{job="blinkengage-backend"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C

      - uid: blinkengage-high-p95-latency
        title: High p95 request latency
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: p95 request latency is above 2 seconds.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              expr: >-
                histogram_quantile(0.95,
                  sum(rate(http_request_duration_seconds_bucket{job="blinkengage-backend"}[5m])) by (le)
                )
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
              refId: C

      - uid: blinkengage-postgres-down
        title: PostgreSQL is down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: postgres-exporter cannot reach PostgreSQL.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              expr: pg_up
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-redis-down
        title: Redis is down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: redis-exporter cannot reach Redis.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              expr: redis_up
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-queue-backlog
        title: RabbitMQ queue backlog
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A queue has over 1000 ready messages for 10+ minutes — consumers may be stuck or under-provisioned.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              expr: max(rabbitmq_queue_messages_ready)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1000] }
              refId: C

      - uid: blinkengage-celery-task-failures
        title: Celery task failure rate
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Celery tasks are failing at more than 1/minute, sustained for 5+ minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              expr: sum(rate(celery_task_failed_total[5m])) * 60
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: C
