apiVersion: 1

groups:
  - orgId: 1
    name: blinkengage-alerts
    folder: Blink Engage
    interval: 1m
    rules:
      - uid: blinkengage-high-5xx-rate
        title: High 5xx error rate
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Backend 5xx error rate is above 5% of total requests.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              # Reads as: the 5xx share of traffic, but only while there is
              # enough traffic for a share to mean anything, and 0 rather
              # than nothing whenever that does not hold.
              #
              # The plain ratio could not express "healthy". A selector
              # matching no series makes `sum()` return an empty vector,
              # not zero, and `empty / anything` is empty — so a backend
              # serving thousands of requests with no errors at all
              # produced no data, and Grafana turns no data into
              # DatasourceNoData critical. The alert was therefore loudest
              # in exactly the state it exists to confirm is fine, and it
              # could not be told apart from a genuinely broken pipeline.
              # It fired that way after every deploy, because a restart
              # resets the counters and no worker has served a 5xx yet.
              #
              # `or vector(0)` is safe *here* specifically because every
              # operand is already aggregated to the empty label set.
              # `or` returns right-hand samples for label sets absent on
              # the left, and `vector(0)` carries no labels: against a
              # bare `http_requests_total{...}` it would have added a
              # permanent extra `{}` series alongside the real ones, which
              # is what kept the nginx alert firing for ten hours (see the
              # note on blinkengage-nginx-down). `sum(...)` leaves `{}` on
              # both sides, so the two genuinely alternate.
              #
              # The `and` is the traffic gate. A ratio over a handful of
              # requests is noise — one error in three is 33% and means
              # nothing — so below ~60 requests in the window (0.2/s) the
              # ratio is discarded and the outer `or vector(0)` reports 0.
              # It is a floor, not the main control: normal probe and
              # scrape traffic sits an order of magnitude above it, so the
              # gate only engages when the backend is genuinely idle.
              #
              # Deliberately NOT responsible for absence. If Prometheus
              # cannot scrape, or the series never appear, this expression
              # says 0 — blinkengage-backend-down and
              # blinkengage-backend-metrics-missing own those, so that
              # "no errors" and "no idea" stay different alerts.
              expr: >-
                (
                  (
                    (
                      sum(rate(http_requests_total{job="blinkengage-backend", status=~"5.."}[5m]))
                      or vector(0)
                    )
                    /
                    sum(rate(http_requests_total{job="blinkengage-backend"}[5m]))
                  )
                  and
                  (
                    sum(rate(http_requests_total{job="blinkengage-backend"}[5m])) >= 0.2
                  )
                )
                or vector(0)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C

      - uid: blinkengage-high-p95-latency
        title: High p95 request latency
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: p95 request latency is above 2 seconds.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                histogram_quantile(0.95,
                  sum(rate(http_request_duration_seconds_bucket{job="blinkengage-backend"}[5m])) by (le)
                )
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
              refId: C

      # Splitting the 5xx rule's old job in three. It used to answer "are
      # there errors", "is anything being scraped" and "do the series
      # exist" with one number, and DatasourceNoData for all three — so a
      # healthy idle backend, a dead backend and a broken exporter were
      # the same critical alert. These two own the second and third
      # questions; the ratio rule above owns only the first.
      #
      # `up` is what Prometheus writes for every scrape attempt: 0 when
      # the target refused, timed out or errored, which covers both the
      # process being gone and /metrics failing while the process lives.
      # `min(...) or vector(0)` rather than a bare `up` so the rule still
      # fires if the target disappears from the scrape config entirely —
      # aggregated first, so the `or` alternates instead of adding a
      # second series (see blinkengage-nginx-down).
      - uid: blinkengage-backend-down
        title: Backend is not answering Prometheus
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The backend target is failing its scrape — the API process is down or /metrics is erroring.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: min(up{job="blinkengage-backend"}) or vector(0)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # The case `up` cannot see: the scrape succeeds, the payload parses,
      # and the request counters are simply not in it. That is what four
      # Uvicorn workers without multiprocess mode produced — a worker that
      # had served nothing answered the scrape and the series vanished for
      # that interval — and it is what any future regression in the
      # exposition registry would produce too. Without this, the failure
      # mode is silence: the 5xx and latency rules read 0 and look fine.
      #
      # `absent()` inverts to 1 only when the selector matches nothing;
      # `max(...)` flattens the labels it carries so `or vector(0)` swaps
      # rather than accumulates. 10m because a cold start legitimately has
      # no series until the first scrape after the first request.
      - uid: blinkengage-backend-metrics-missing
        title: Backend request metrics are missing
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The backend is being scraped but exposes no http_requests_total — the 5xx and latency alerts are blind.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                max(absent(http_requests_total{job="blinkengage-backend"}))
                or vector(0)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: blinkengage-postgres-down
        title: PostgreSQL is down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: postgres-exporter cannot reach PostgreSQL.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: pg_up
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-redis-down
        title: Redis is down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: redis-exporter cannot reach Redis.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: redis_up
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-queue-backlog
        title: RabbitMQ queue backlog
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A queue has over 1000 ready messages for 10+ minutes — consumers may be stuck or under-provisioned.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(rabbitmq_queue_messages_ready{job="rabbitmq-queues"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1000] }
              refId: C

      - uid: blinkengage-celery-task-failures
        title: Celery task failure rate
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Celery tasks are failing at more than 1/minute, sustained for 5+ minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(rate(celery_task_failed_total[5m])) * 60
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: C

      # The gap the backlog alert cannot see. A queue with zero consumers and
      # zero messages looks identical to a healthy idle queue on a depth graph;
      # the difference only shows in the consumer count. This is what catches a
      # consumer container that died and was not restarted.
      - uid: blinkengage-queue-no-consumers
        title: Event queue has no consumers
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A durable event queue has zero consumers attached — messages are accumulating unread.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                min by (queue) (rabbitmq_queue_consumers{job="rabbitmq-queues", queue!~"celery.*|.+\\.retry|.+\\.dlq"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # A dead-lettered message is one the platform gave up on. It is safe —
      # quarantined rather than lost, and replayable — but it is also an event
      # that did not happen, so somebody has to decide whether it mattered.
      # Fires at one message, not at a rate: a single poison event is a defect.
      - uid: blinkengage-dlq-not-empty
        title: Messages in a dead-letter queue
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: One or more events were dead-lettered after exhausting their retries — they are quarantined and need triage.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                sum(rabbitmq_queue_messages{job="rabbitmq-queues", queue=~".+\\.dlq"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      # The transactional outbox is the only path events take out of the
      # database. If the relay stops, every downstream consumer goes quiet and
      # nothing else alerts — the queues are empty, which reads as healthy.
      - uid: blinkengage-outbox-stalled
        title: Outbox relay is not draining
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Undispatched outbox events are accumulating — the relay has stopped or is failing to publish.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                blinkengage_outbox_undispatched
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [500] }
              refId: C

      # Found for real in phase 1.5: beat had been up 41 hours and had no entry
      # for a newly-added schedule, so the sweep never fired. Nothing errored,
      # no queue grew, and the dashboard showed numbers that looked like 'no
      # traffic' rather than 'the scheduler forgot'. Two hours covers the
      # hourly sweeps with margin.
      - uid: blinkengage-scheduler-stale
        title: A scheduled sweep has stopped running
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A Celery beat schedule has not produced a run within its expected interval.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              # Each task measured against its OWN interval, not a shared
              # threshold. The beat schedule spans five seconds (the outbox
              # relay) to twenty-four hours (configuration drift), so any
              # single number is either permanently breached by the daily
              # tasks — paging every morning about something healthy — or
              # blind to a five-second task that died yesterday.
              #
              # The result is "intervals missed"; the threshold below is 3,
              # so a task has to miss three of its own cycles.
              #
              # `clamp_min(interval, 60)` is a floor on the denominator,
              # without which this cannot work for fast tasks. Prometheus
              # scrapes every 15s, so `last_run_timestamp` is only as
              # fresh as the last scrape. `pickup_waiting_conversations`
              # runs every 10 seconds: between scrapes `time() -
              # last_run` routinely reaches 30-45s — 3 to 4.5 of its own
              # intervals — while the task is running perfectly. Observed
              # flapping between 2.17 and 4.30 against a threshold of 3,
              # firing critical on measurement granularity rather than on
              # anything being wrong.
              #
              # The floor says: however fast a task is scheduled, a
              # minute is the shortest silence worth measuring. A 10s
              # task now needs three minutes of silence — still fast, and
              # genuinely stuck rather than merely unscraped. Tasks
              # slower than a minute are untouched, so the 24h drift
              # sweep keeps exactly the sensitivity it had.
              expr: >-
                max(
                  (time() - blinkengage_scheduler_last_run_timestamp_seconds)
                  / on(task) group_left
                  clamp_min(blinkengage_scheduler_expected_interval_seconds, 60)
                )
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3] }
              refId: C

      # Backed by the node-exporter scrape job. A full disk is the failure
      # that takes the database down with it, and it is entirely
      # predictable — which makes not alerting on it the least excusable
      # of the gaps this work closed.
      - uid: blinkengage-disk-filling
        title: Host disk is filling
        condition: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Less than 15% of disk remains — Postgres stops accepting writes when it runs out.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                100 * min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [15] }
              refId: C

      # Attachments live here. A customer sending a photo gets a failure and the
      # API surfaces it as a 500, so this is customer-visible immediately.
      - uid: blinkengage-minio-down
        title: MinIO is unreachable
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Object storage is down — attachments cannot be read or written.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                min(up{job="minio"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-nginx-down
        title: nginx is down
        condition: C
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: The edge is not answering. Every customer request goes through nginx, so this is a total outage from a customer's point of view.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              # `nginx_up`, not `up{job="nginx"}`. The exporter is a
              # separate process: when nginx dies it keeps answering
              # Prometheus and reports nginx_up=0, so the scrape stays
              # healthy and `up` stays 1. A rule on `up` would have been
              # silent for exactly the outage it is named after —
              # verified by stopping nginx and watching it not fire.
              #
              # `or vector(0)` covers the other direction: if the
              # exporter itself is gone the series disappears entirely,
              # and an alert with no data is an alert that does not fire.
              # `min(...)`, not a bare `nginx_up`. PromQL's `or` returns
              # the right-hand side for every label set NOT present on
              # the left — and `vector(0)` carries an empty label set,
              # which `nginx_up{instance=...,job=...}` never matches. So
              # the bare form returned *both* series: nginx_up=1 and a
              # permanent {}=0, and the alert fired forever regardless of
              # nginx. It did exactly that for ten hours before this was
              # caught.
              #
              # `min()` aggregates away the labels, so the left side is
              # also `{}` — now `or` genuinely means "nginx_up if the
              # exporter is reporting, otherwise 0".
              expr: min(nginx_up) or vector(0)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-grafana-down
        title: Grafana is down
        condition: C
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: Grafana is unreachable. Alert evaluation and every dashboard stop with it.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="grafana"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: blinkengage-loki-down
        title: Loki is down
        condition: C
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: Loki is unreachable. Logs are still written to disk but cannot be searched during an incident.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="loki"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # A heartbeat that is always firing, on purpose.
      #
      # Every other rule here proves something is wrong. None of them can
      # prove the alerting path itself still works: if Grafana stops
      # evaluating, or the contact point silently stops delivering, the
      # symptom is *silence* — which is indistinguishable from a healthy
      # platform. `vector(1) > 0` is unconditionally true, so this fires
      # continuously and the sink receives it on every notification cycle.
      #
      # The signal is its ABSENCE. If ops-heartbeat stops arriving, alerting
      # is broken, whatever the dashboards say. Route it somewhere that
      # notices silence rather than at a human, who would learn to ignore it.
      - uid: blinkengage-alerting-heartbeat
        title: Alerting heartbeat
        condition: C
        for: 0s
        labels:
          severity: heartbeat
        annotations:
          summary: >-
            Always firing. Its absence means the alerting path is broken, not
            that the platform is healthy.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: vector(1)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
