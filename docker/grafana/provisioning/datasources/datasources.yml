apiVersion: 1

# Explicit uids. Without one Grafana generates a random uid per install,
# and anything referencing the datasource by a fixed string silently
# fails to resolve it. Two things were referencing them:
#
#  - every provisioned alert rule, via `datasourceUid: Prometheus` — the
#    *name*, while the uid was an autogenerated PBFA97CFB590B2093. All
#    twelve rules were provisioned, visible in the UI, and incapable of
#    evaluating: "data source not found".
#  - the log dashboard panels, via `"uid": "Loki"`, against an actual uid
#    of P8E80F9AEF21F6940.
#
# Both failures are silent and both look like working configuration,
# which is why they survived this long. Pinning the uids is what makes a
# provisioned reference mean the same thing on every install.
#
# Loki's uid is capitalised to match the reference already baked into
# docker/grafana/dashboards/*.json.

# Grafana cannot change the uid of an existing datasource in place — it
# matches on name and then fails the update with "data source not found".
# Deleting first is what lets the uid above actually take effect on an
# installation that already provisioned these. Datasources hold no data,
# so this costs nothing; the delete runs before the insert below.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
