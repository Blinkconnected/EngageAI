# Access-log format carrying server-side timing. Included into the http{}
# context by the stock nginx.conf's `include /etc/nginx/conf.d/*.conf;` —
# the 00- prefix on the mounted/copied filename matters: nginx globs that
# include in sorted order, so this file must sort ahead of default.conf or
# the server blocks there reference a log_format that isn't defined yet and
# nginx refuses to start.
#
# The two timing variables answer different questions, which is the whole
# point of logging both:
#   $request_time           - wall-clock time nginx spent on the request,
#                             measured from the first client byte read to the
#                             last byte written. This is what the user feels.
#   $upstream_response_time - time the backend alone took. Excludes nginx
#                             overhead, request body upload and response
#                             download over the client's link.
# A large $request_time next to a small $upstream_response_time means the
# app is fine and the client link (or a slow upload) is the cost; the two
# rising together means the backend is genuinely slow. Without both numbers
# there is no way to tell those cases apart from the access log alone.
#
# Kept byte-compatible with the stock `main` format (same fields, same
# order) so any existing log tooling keeps parsing it; the rt=/urt= pairs
# are appended at the end where a trailing-field parser can ignore them.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_x_forwarded_for" '
                 'rt=$request_time urt=$upstream_response_time';
