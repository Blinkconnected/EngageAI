map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Using a variable in proxy_pass forces nginx to
    # re-resolve at request time instead of once at startup, so it neither
    # fails to boot nor crash-loops if a dependent container isn't up yet
    # or gets recreated (common during `docker compose up` ordering/restarts).
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 25m;

    # Per-server override of the http-level `main` format, so this vhost logs
    # backend timing (see docker/nginx/logging.conf for what rt=/urt= mean).
    access_log /var/log/nginx/access.log timed;

    # ACME HTTP-01 challenge webroot for Let's Encrypt (certbot --webroot).
    # Served straight from disk ahead of the catch-all `location /` proxy so
    # renewals never touch the frontend upstream and need no downtime. The
    # host dir is bind-mounted read-only; certbot writes the token there.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # NOTE: proxy_pass targets below deliberately have no path component.
    # Once a variable is used in proxy_pass, nginx stops doing prefix
    # substitution and instead forwards the original request URI unchanged —
    # which is exactly what we want here since paths are identical on both
    # sides (nginx's /api/v1/x maps straight to the backend's /api/v1/x).
    #
    # Includes Upgrade/Connection headers so this one location transparently
    # handles both plain REST calls and the two WebSocket routes that live
    # under /api/v1 (the agent realtime gateway at /api/v1/ws/agent, and
    # web-chat's per-session socket at /api/v1/web-chat/ws/{id}) — both are
    # mounted through the same api_router as every REST endpoint, not
    # registered separately on the app, so there's no separate /ws/ prefix
    # to route around. (An earlier version of this file had a standalone
    # /ws/ location proxying verbatim to backend:8000/ws/agent — a path
    # that was never real; the correct path always needed the /api/v1
    # prefix. A `rewrite ... break` fix was tried and confirmed broken too:
    # combining `rewrite` with the `set $backend_upstream` variable in the
    # same location left the variable uninitialized at proxy_pass time
    # ("invalid URL prefix" / 500) — a real, reproducible nginx footgun,
    # not a config typo. Routing every WS path through its own real,
    # already-correct /api/v1/... prefix sidesteps the whole class of bug.)
    # Harmless for ordinary (non-upgrade) requests: $http_upgrade is empty
    # for those, so $connection_upgrade resolves to "close" as normal.
    # Liveness and connection counters for nginx itself, read by
    # nginx-prometheus-exporter. Until this existed the edge — the one
    # component every customer request passes through — had no scrape
    # target and no alert: nginx failing was indistinguishable from a
    # total outage, and nothing would have paged.
    #
    # Same allow-list as /metrics: private ranges and loopback only. It
    # leaks connection counts, which is not sensitive, but there is no
    # reason to publish it either.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Internal only — the same restriction nginx.prod.conf carries, and it
    # belongs here too: this file terminates TLS for a real hostname, so
    # "dev" describes the frontend upstream (Vite) rather than the
    # exposure. Request rates, per-endpoint latency and error counts are
    # operational data; with per-tenant label cardinality they disclose
    # which tenants are active and how busy.
    #
    # Prometheus is unaffected: it scrapes backend:8000/metrics directly
    # over the internal Docker network and never traverses this route.
    # This location exists for an operator curling it from inside.
    # Liveness for the container healthcheck. Served by nginx itself
    # rather than proxied, so a backend outage does not also mark the
    # proxy unhealthy and restart it — that turns one failure into two.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # Vite dev server + its HMR websocket
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# TLS termination for providers that require HTTPS webhooks (e.g. Telegram
# rejects any non-HTTPS setWebhook URL outright, and Meta refuses to deliver
# to a webhook whose certificate isn't CA-signed). Now a real Let's Encrypt
# cert for engage.blinkconnected.com, issued via the ACME webroot in the
# port-80 block above; the previous self-signed pair is left in
# docker/nginx/certs as the fallback for a domain-less local checkout.
# Locations are identical to the port-80 server block above; nginx has no
# clean way to share location blocks across servers without an include file,
# and duplicating a 3-location dev config is simpler than introducing one
# for a single extra server block.
server {
    listen 443 ssl;
    server_name engage.blinkconnected.com;

    # Mounted read-only from the host's /etc/letsencrypt (see
    # docker-compose.yml). certbot's deploy hook reloads nginx on renewal,
    # so these paths stay valid across the 90-day cycle without a restart.
    ssl_certificate     /etc/letsencrypt/live/engage.blinkconnected.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engage.blinkconnected.com/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    client_max_body_size 25m;
    access_log /var/log/nginx/access.log timed;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Internal only — the same restriction nginx.prod.conf carries, and it
    # belongs here too: this file terminates TLS for a real hostname, so
    # "dev" describes the frontend upstream (Vite) rather than the
    # exposure. Request rates, per-endpoint latency and error counts are
    # operational data; with per-tenant label cardinality they disclose
    # which tenants are active and how busy.
    #
    # Prometheus is unaffected: it scrapes backend:8000/metrics directly
    # over the internal Docker network and never traverses this route.
    # This location exists for an operator curling it from inside.
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
