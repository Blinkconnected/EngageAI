map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Using a variable in proxy_pass forces nginx to
    # re-resolve at request time instead of once at startup, so it neither
    # fails to boot nor crash-loops if a dependent container isn't up yet
    # or gets recreated (common during `docker compose up` ordering/restarts).
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 25m;

    # NOTE: proxy_pass targets below deliberately have no path component.
    # Once a variable is used in proxy_pass, nginx stops doing prefix
    # substitution and instead forwards the original request URI unchanged —
    # which is exactly what we want here since paths are identical on both
    # sides (nginx's /api/v1/x maps straight to the backend's /api/v1/x).
    #
    # Includes Upgrade/Connection headers so this one location transparently
    # handles both plain REST calls and the two WebSocket routes that live
    # under /api/v1 (the agent realtime gateway at /api/v1/ws/agent, and
    # web-chat's per-session socket at /api/v1/web-chat/ws/{id}) — both are
    # mounted through the same api_router as every REST endpoint, not
    # registered separately on the app, so there's no separate /ws/ prefix
    # to route around. (An earlier version of this file had a standalone
    # /ws/ location proxying verbatim to backend:8000/ws/agent — a path
    # that was never real; the correct path always needed the /api/v1
    # prefix. A `rewrite ... break` fix was tried and confirmed broken too:
    # combining `rewrite` with the `set $backend_upstream` variable in the
    # same location left the variable uninitialized at proxy_pass time
    # ("invalid URL prefix" / 500) — a real, reproducible nginx footgun,
    # not a config typo. Routing every WS path through its own real,
    # already-correct /api/v1/... prefix sidesteps the whole class of bug.)
    # Harmless for ordinary (non-upgrade) requests: $http_upgrade is empty
    # for those, so $connection_upgrade resolves to "close" as normal.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /metrics {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # Vite dev server + its HMR websocket
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
