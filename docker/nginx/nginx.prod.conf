map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Two server blocks, and they are deliberately NOT symmetrical.
#
# Port 80 answers exactly three things and redirects everything else: the
# container healthcheck, the nginx-exporter scrape, and the ACME challenge.
# All three speak plain HTTP to this container by design and would break if
# they were redirected. The application — static bundle and /api — is served
# only over TLS, on 443.
#
# This file previously had no TLS at all and served the app on port 80,
# because the production image assumed TLS was terminated by a load balancer
# in front of it. There is no such load balancer: nginx is the edge, and the
# Let's Encrypt certificate lived only in the *dev* config. That is the whole
# reason production was still running the dev config, and with it the Vite
# dev server.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;
    access_log /var/log/nginx/access.log timed;

    # Liveness for the container healthcheck, served by nginx itself rather
    # than proxied so a backend outage does not also mark the proxy
    # unhealthy and restart it — that turns one failure into two.
    #
    # Deliberately NOT redirected to HTTPS below: the healthcheck runs
    # `wget http://127.0.0.1/healthz` from inside the container, and a 301
    # to the public hostname would send it back out through DNS it cannot
    # necessarily resolve.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Liveness and connection counters for nginx itself, read by
    # nginx-prometheus-exporter over the internal network on port 80. Also
    # exempt from the redirect: the exporter speaks plain HTTP to the
    # container, not to the public name.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # ACME HTTP-01 webroot. Must stay on port 80 and must not redirect:
    # Let's Encrypt validates over plain HTTP, so redirecting this is how a
    # renewal fails 89 days after anybody last looked at it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name engage.blinkconnected.com;

    # Mounted read-only from the host's /etc/letsencrypt (see the nginx
    # service in docker-compose.prod.yml). certbot's deploy hook reloads
    # nginx on renewal, so these paths stay valid across the 90-day cycle
    # without a restart.
    ssl_certificate     /etc/letsencrypt/live/engage.blinkconnected.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engage.blinkconnected.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Docker's embedded DNS. Using a variable in proxy_pass forces nginx to
    # re-resolve at request time instead of once at startup, so it neither
    # fails to boot nor crash-loops if the backend container isn't up yet
    # or gets recreated.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 25m;
    root /usr/share/nginx/html;
    index index.html;

    # Per-server override of the http-level `main` format, so this vhost logs
    # backend timing (see docker/nginx/logging.conf for what rt=/urt= mean).
    access_log /var/log/nginx/access.log timed;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Only meaningful once TLS is actually terminated here, which is what
    # this server block changed — announcing it from the plain-HTTP config
    # would have been a promise the edge could not keep.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # NOTE: proxy_pass targets below deliberately have no path component.
    # Once a variable is used in proxy_pass, nginx stops doing prefix
    # substitution and instead forwards the original request URI unchanged —
    # which is exactly what we want here since paths are identical on both
    # sides (nginx's /api/v1/x maps straight to the backend's /api/v1/x).
    #
    # Includes Upgrade/Connection headers so this one location transparently
    # handles both plain REST calls and the two WebSocket routes that live
    # under /api/v1 (the agent realtime gateway at /api/v1/ws/agent, and
    # web-chat's per-session socket at /api/v1/web-chat/ws/{id}) — both are
    # mounted through the same api_router as every REST endpoint, not
    # registered separately on the app, so there's no separate /ws/ prefix
    # to route around. Harmless for ordinary requests: $http_upgrade is
    # empty for those, so $connection_upgrade resolves to "close" as normal.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Internal only (see docs/security/hardening.md) — request-rate/
    # latency-per-endpoint metrics are operational data, not something to
    # expose to the public internet. Prometheus itself never goes through
    # this route anyway (it scrapes backend:8000/metrics directly over the
    # internal Docker network); this location exists only for operators
    # who need to curl it manually from inside the private network.
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # Vite fingerprints every file under /assets, so the content of a given
    # URL never changes and a year is safe. index.html is deliberately not
    # cached this way — it is the document that points at the new hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
