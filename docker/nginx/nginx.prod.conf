map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Using a variable in proxy_pass forces nginx to
    # re-resolve at request time instead of once at startup, so it neither
    # fails to boot nor crash-loops if the backend container isn't up yet
    # or gets recreated.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 25m;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # NOTE: proxy_pass targets below deliberately have no path component.
    # Once a variable is used in proxy_pass, nginx stops doing prefix
    # substitution and instead forwards the original request URI unchanged —
    # which is exactly what we want here since paths are identical on both
    # sides (nginx's /api/v1/x maps straight to the backend's /api/v1/x).
    #
    # Includes Upgrade/Connection headers so this one location transparently
    # handles both plain REST calls and the two WebSocket routes that live
    # under /api/v1 (the agent realtime gateway at /api/v1/ws/agent, and
    # web-chat's per-session socket at /api/v1/web-chat/ws/{id}) — both are
    # mounted through the same api_router as every REST endpoint, not
    # registered separately on the app, so there's no separate /ws/ prefix
    # to route around (see the dev config's longer note on why a standalone
    # /ws/ location proxying to backend:8000/ws/agent never actually worked,
    # confirmed live). Harmless for ordinary requests: $http_upgrade is
    # empty for those, so $connection_upgrade resolves to "close" as normal.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Internal only (see docs/security/hardening.md) — request-rate/
    # latency-per-endpoint metrics are operational data, not something to
    # expose to the public internet. Prometheus itself never goes through
    # this route anyway (it scrapes backend:8000/metrics directly over the
    # internal Docker network); this location exists only for operators
    # who need to curl it manually from inside the private network.
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
